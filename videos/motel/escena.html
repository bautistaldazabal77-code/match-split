<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Habitación 13</title>
<style>
  @font-face { font-family: 'Caveat'; font-weight: 700; src: url('../node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .layer { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #grain { image-rendering: pixelated; opacity: .07; mix-blend-mode: overlay; }
  #vignette { background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55) 85%, rgba(0,0,0,.85) 100%); }
  #black { background: #000; opacity: 0; }
  #flash { background: #fff; opacity: 0; mix-blend-mode: screen; }

  /* Cámara de seguridad */
  #cctv { display: none; font-family: 'JetBrains Mono', monospace; color: #e8ffe8; font-weight: 600; text-shadow: 0 0 6px rgba(160,255,160,.6); }
  #cctv .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 5px); }
  #cctv .tl { position: absolute; left: 64px; top: 150px; font-size: 38px; letter-spacing: 2px; }
  #cctv .tr { position: absolute; right: 64px; top: 150px; font-size: 38px; }
  #cctv .tr b { color: #ff4040; text-shadow: 0 0 10px #ff2020; }
  #cctv .bl { position: absolute; left: 64px; top: 210px; font-size: 32px; opacity: .85; }
  #cctv .zoom { position: absolute; right: 64px; top: 210px; font-size: 32px; opacity: .85; }
  #cctv .corner { position: absolute; width: 70px; height: 70px; border: 4px solid rgba(230,255,230,.7); }

  /* Subtítulos */
  #caps { position: absolute; left: 90px; right: 90px; top: 1150px; text-align: center;
          font-family: 'Inter Display', 'Inter', sans-serif; font-weight: 900; font-size: 84px; line-height: 1.08;
          text-transform: uppercase; color: #fff; letter-spacing: -1px;
          text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 0 24px rgba(0,0,0,.8); -webkit-text-stroke: 3px rgba(0,0,0,.65); paint-order: stroke fill; }
  #caps .w { display: inline-block; margin: 0 .12em; }
  #caps .cur { color: #ffd84d; }
  #caps.tel { color: #ff5a4f; font-style: italic; }
  #caps.tel .cur { color: #ffb0a8; }

  /* Llamada */
  #call { display: none; font-family: 'JetBrains Mono', monospace; color: #ff6a5f; text-align: center; }
  #call .who { position: absolute; top: 500px; width: 100%; font-size: 76px; letter-spacing: 6px; font-weight: 700; }
  #call .timer { position: absolute; top: 610px; width: 100%; font-size: 40px; color: #a35a54; letter-spacing: 3px; }
  #call .wave { position: absolute; top: 760px; left: 150px; width: 780px; height: 280px; display: flex; align-items: center; justify-content: space-between; }
  #call .wave i { display: block; width: 14px; border-radius: 7px; background: #ff4d42; box-shadow: 0 0 14px rgba(255,60,50,.7); }

  /* Decisión */
  #decision { display: none; font-family: 'Inter Display', 'Inter', sans-serif; }
  #decision .q { position: absolute; top: 330px; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 112px; line-height: .98; color: #fff;
                 letter-spacing: -2px; text-shadow: 0 6px 30px rgba(0,0,0,.8); }
  #decision .opt { position: absolute; left: 150px; right: 150px; height: 150px; border-radius: 26px; display: flex; align-items: center; gap: 30px; padding: 0 40px;
                   color: #fff; font-weight: 900; font-size: 52px; letter-spacing: -0.5px; box-shadow: 0 16px 50px rgba(0,0,0,.6); transform-origin: 50% 50%; }
  #decision .opt .n { flex: none; width: 84px; height: 84px; border-radius: 50%; background: rgba(255,255,255,.95); display: grid; place-items: center; font-size: 54px; }
  #decision .o1 { top: 640px; background: linear-gradient(180deg, #d83a32, #a5211c); }
  #decision .o1 .n { color: #b3241e; }
  #decision .o2 { top: 830px; background: linear-gradient(180deg, #2e5d9e, #1d3f70); }
  #decision .o2 .n { color: #1f4479; }
  #decision .cta { position: absolute; top: 1040px; left: 0; right: 0; text-align: center; color: #ffd84d; font-weight: 800; font-size: 50px; text-shadow: 0 4px 20px rgba(0,0,0,.8); }
</style>
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js" } }</script>
</head>
<body>
  <canvas id="gl" width="1080" height="1920"></canvas>
  <canvas id="grain" class="layer" width="270" height="480"></canvas>
  <div id="vignette" class="layer"></div>
  <div id="cctv" class="layer">
    <div class="scan"></div>
    <div class="corner" style="left:40px;top:120px;border-right:0;border-bottom:0"></div>
    <div class="corner" style="right:40px;top:120px;border-left:0;border-bottom:0"></div>
    <div class="corner" style="left:40px;bottom:120px;border-right:0;border-top:0"></div>
    <div class="corner" style="right:40px;bottom:120px;border-left:0;border-top:0"></div>
    <div class="tl" id="cctv-cam">CAM 02 · PISO 2</div>
    <div class="tr"><b>●</b> REC</div>
    <div class="bl" id="cctv-time">14/11 03:06:41</div>
    <div class="zoom" id="cctv-zoom"></div>
  </div>
  <div id="call" class="layer">
    <div class="who">HAB. 13</div>
    <div class="timer" id="call-timer">EN LLAMADA · 00:00</div>
    <div class="wave" id="call-wave"></div>
  </div>
  <div id="decision" class="layer">
    <div class="q" id="dq">¿QUÉ HARÍAS<br>TÚ?</div>
    <div class="opt o1" id="o1"><span class="n">1</span>SUBIR A LA 13</div>
    <div class="opt o2" id="o2"><span class="n">2</span>LLAMAR A LA POLICÍA</div>
    <div class="cta" id="cta">Comenta 1 o 2 ↓</div>
  </div>
  <div id="caps"></div>
  <div id="flash" class="layer"></div>
  <div id="black" class="layer"></div>
  <script type="module" src="escena.js"></script>
</body>
</html>
