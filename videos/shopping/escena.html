<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cerrado</title>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .layer { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #grain { image-rendering: pixelated; opacity: .07; mix-blend-mode: overlay; }
  #vignette { background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55) 85%, rgba(0,0,0,.85) 100%); }
  #black { background: #000; opacity: 0; }
  #flash { background: #fff; opacity: 0; mix-blend-mode: screen; }

  /* Subtítulos */
  #caps { position: absolute; left: 90px; right: 90px; top: 1150px; text-align: center;
          font-family: 'Inter Display', 'Inter', sans-serif; font-weight: 900; font-size: 84px; line-height: 1.08;
          text-transform: uppercase; color: #fff; letter-spacing: -1px;
          text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 0 24px rgba(0,0,0,.8); -webkit-text-stroke: 3px rgba(0,0,0,.65); paint-order: stroke fill; }
  #caps .w { display: inline-block; margin: 0 .12em; }
  #caps .cur { color: #ffd84d; }
  #caps.altavoz { color: #8fdcff; font-style: italic; }
  #caps.altavoz .cur { color: #ffffff; }

  /* Celular */
  #phone { display: none; position: absolute; left: 270px; top: 170px; width: 540px; height: 940px; border-radius: 70px;
           background: linear-gradient(170deg, #1b2236, #0b0e18 60%); border: 14px solid #0d0d10; box-shadow: 0 30px 90px rgba(0,0,0,.8), inset 0 0 0 2px #2b2f3a;
           font-family: 'Inter', sans-serif; color: #fff; overflow: hidden; }
  #phone .notch { position: absolute; left: 50%; top: 18px; width: 150px; height: 40px; margin-left: -75px; border-radius: 22px; background: #000; }
  #phone .status { position: absolute; top: 26px; left: 44px; right: 40px; display: flex; justify-content: space-between; font-size: 26px; font-weight: 600; }
  #phone .status .bat { color: #ff4d4d; }
  #phone .time { position: absolute; top: 150px; width: 100%; text-align: center; font-family: 'Inter Display', 'Inter'; font-weight: 700; font-size: 190px; letter-spacing: -6px; }
  #phone .date { position: absolute; top: 120px; width: 100%; text-align: center; font-size: 30px; font-weight: 600; opacity: .85; }
  #phone .noserv { position: absolute; top: 420px; left: 40px; right: 40px; padding: 26px 28px; border-radius: 34px; background: rgba(255,255,255,.12);
                   font-size: 30px; line-height: 1.3; }
  #phone .noserv b { display: block; font-size: 24px; letter-spacing: 1px; opacity: .7; margin-bottom: 6px; }
  #phone .noserv2 { top: 600px; }

  /* Decisión */
  #decision { display: none; font-family: 'Inter Display', 'Inter', sans-serif; }
  #decision .q { position: absolute; top: 330px; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 112px; line-height: .98; color: #fff;
                 letter-spacing: -2px; text-shadow: 0 6px 30px rgba(0,0,0,.8); }
  #decision .opt { position: absolute; left: 130px; right: 130px; height: 150px; border-radius: 26px; display: flex; align-items: center; gap: 30px; padding: 0 40px;
                   color: #fff; font-weight: 900; font-size: 50px; letter-spacing: -0.5px; box-shadow: 0 16px 50px rgba(0,0,0,.6); transform-origin: 50% 50%; }
  #decision .opt .n { flex: none; width: 84px; height: 84px; border-radius: 50%; background: rgba(255,255,255,.95); display: grid; place-items: center; font-size: 54px; }
  #decision .o1 { top: 640px; background: linear-gradient(180deg, #1f9e5a, #13703e); }
  #decision .o1 .n { color: #14743f; }
  #decision .o2 { top: 830px; background: linear-gradient(180deg, #b0322b, #7d1d18); }
  #decision .o2 .n { color: #8a201b; }
  #decision .cta { position: absolute; top: 1040px; left: 0; right: 0; text-align: center; color: #ffd84d; font-weight: 800; font-size: 50px; text-shadow: 0 4px 20px rgba(0,0,0,.8); }
</style>
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js" } }</script>
</head>
<body>
  <canvas id="gl" width="1080" height="1920"></canvas>
  <canvas id="grain" class="layer" width="270" height="480"></canvas>
  <div id="vignette" class="layer"></div>
  <div id="phone">
    <div class="notch"></div>
    <div class="status"><span>Sin servicio</span><span class="bat">▮ 4%</span></div>
    <div class="date">martes, 14 de noviembre</div>
    <div class="time" id="phone-time">3:00</div>
    <div class="noserv"><b>PLAZA MIRADOR · ahora</b>¡Gracias por tu visita! Te esperamos mañana.</div>
    <div class="noserv noserv2" id="phone-n2"><b>TELÉFONO</b>Sin señal. Solo llamadas de emergencia.</div>
  </div>
  <div id="decision" class="layer">
    <div class="q" id="dq">¿QUÉ HARÍAS<br>TÚ?</div>
    <div class="opt o1" id="o1"><span class="n">1</span>CORRER A LA SALIDA</div>
    <div class="opt o2" id="o2"><span class="n">2</span>VOLVER AL PROBADOR</div>
    <div class="cta" id="cta">Comenta 1 o 2 ↓</div>
  </div>
  <div id="caps"></div>
  <div id="flash" class="layer"></div>
  <div id="black" class="layer"></div>
  <script type="module" src="escena.js"></script>
</body>
</html>
